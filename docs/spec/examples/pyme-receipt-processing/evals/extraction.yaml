# Eval suite: extraction and routing. One case per YAML document; each runs in a fresh instance.
# The file arrives as the folder trigger delivers it (an XML's text inline); the SAT check and
# the ERP are fixtures, so nothing is posted anywhere.
id: xml-invoice-happy-path
description: A valid CFDI for the company, under the auto-post limit, is checked and posted once.
setup:
  event:
    start: "2026-10-20T10:00:00-06:00"
    file:
      name: 01-office-supplies.xml
      key: 01-office-supplies.xml
      uri: file:///inbox/01-office-supplies.xml
      content_type: application/xml
      text: |
        <?xml version="1.0" encoding="UTF-8"?>
        <cfdi:Comprobante xmlns:cfdi="http://www.sat.gob.mx/cfd/4" xmlns:tfd="http://www.sat.gob.mx/TimbreFiscalDigital" Version="4.0" Fecha="2026-10-20T10:15:00" SubTotal="4000.00" Moneda="MXN" Total="4640.00" TipoDeComprobante="I">
          <cfdi:Emisor Rfc="XIA190128J61" Nombre="XENON INDUSTRIAL ARTICLES" RegimenFiscal="601"/>
          <cfdi:Receptor Rfc="EKU9003173C9" Nombre="ESCUELA KEMPER URGATE" UsoCFDI="G03"/>
          <cfdi:Conceptos><cfdi:Concepto Descripcion="Papel y toner" Importe="4000.00"/></cfdi:Conceptos>
          <cfdi:Impuestos TotalImpuestosTrasladados="640.00"/>
          <cfdi:Complemento><tfd:TimbreFiscalDigital UUID="6F1A2B3C-4D5E-4F60-8A71-92B3C4D5E6F7"/></cfdi:Complemento>
        </cfdi:Comprobante>
  fixtures:
    cfdi.validate: { valid: true, status: Vigente }
    erp.find_entry: { found: false }
    erp.create_entry: { id: E-0001, created: true }
turns:
  - trigger: new-document
  - expect_tool: [cfdi.validate, erp.find_entry, erp.create_entry]
---
id: another-company-goes-to-a-person
description: A valid CFDI addressed to another company's RFC is never posted.
setup:
  event:
    start: "2026-10-20T10:00:00-06:00"
    file:
      name: 04-wrong-company.xml
      key: 04-wrong-company.xml
      uri: file:///inbox/04-wrong-company.xml
      content_type: application/xml
      text: |
        <?xml version="1.0" encoding="UTF-8"?>
        <cfdi:Comprobante xmlns:cfdi="http://www.sat.gob.mx/cfd/4" xmlns:tfd="http://www.sat.gob.mx/TimbreFiscalDigital" Version="4.0" Fecha="2026-10-20T10:15:00" SubTotal="2500.00" Moneda="MXN" Total="2900.00" TipoDeComprobante="I">
          <cfdi:Emisor Rfc="XIA190128J61" Nombre="XENON INDUSTRIAL ARTICLES" RegimenFiscal="601"/>
          <cfdi:Receptor Rfc="IIA040805DZ4" Nombre="ESCUELA KEMPER URGATE" UsoCFDI="G03"/>
