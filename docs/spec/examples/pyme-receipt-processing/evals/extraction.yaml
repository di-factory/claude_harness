          <cfdi:Impuestos TotalImpuestosTrasladados="400.00"/>
          <cfdi:Complemento><tfd:TimbreFiscalDigital UUID="8B3C4D5E-6F70-4B82-AC93-B4D5E6F70819"/></cfdi:Complemento>
        </cfdi:Comprobante>
  fixtures:
    cfdi.validate: { valid: true, status: Vigente }
