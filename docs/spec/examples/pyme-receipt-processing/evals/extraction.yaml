---
id: ticket-photo-goes-to-a-person
description: A photo of a taxi ticket (not a fiscal receipt, no UUID) is read and handed to a person.
setup:
  event:
    start: "2026-10-20T10:00:00-06:00"
    file:
      name: 06-taxi-ticket.jpg
      key: 06-taxi-ticket.jpg
      uri: file:///inbox/06-taxi-ticket.jpg
      content_type: image/jpeg
  fixtures:
    cfdi.validate: { valid: true, status: Vigente }
    erp.find_entry: { found: false }
    erp.create_entry: { id: E-0001, created: true }
    documents.ocr: { uri: "file:///inbox/06-taxi-ticket.jpg", method: ocr, text: "TAXIS DEL VALLE  Fecha 26/10/2026  TOTAL $206.00  Pago efectivo  Este no es un comprobante fiscal" }
turns:
  - trigger: new-document
  - expect_handoff: human
must_not:
  - tool: erp.create_entry
